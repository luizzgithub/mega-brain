<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Cerebro</title>
  <style>
    :root {
      --bg:       #07080e;
      --surface:  #0d1020;
      --border:   #1a2038;
      --accent:   #6c63ff;
      --cyan:     #00d4ff;
      --red:      #ff3b5c;
      --green:    #00e57a;
      --text:     #dde6ff;
      --muted:    #4a5880;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      gap: 2rem;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-name {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(100deg, var(--accent) 30%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 0.15rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.45rem;
    }

    /* "Força Total" badge */
    .force-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--green);
      background: rgba(0, 229, 122, 0.07);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--green);
      text-transform: uppercase;
    }

    .force-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
      50%       { opacity: 0.45; box-shadow: 0 0 2px var(--green); }
    }

    /* Server status */
    #status-badge {
      display: flex;
      align-items: center;
      gap: 0.38rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #status-dot.offline { background: var(--red); }

    /* ── Card ───────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem 1.8rem 1.5rem;
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
    }

    /* ── Waveform canvas ────────────────────────────────────────────── */
    #waveform {
      width: 100%;
      height: 72px;
      display: block;
      border-radius: 8px;
    }

    /* ── Central record button ──────────────────────────────────────── */
    .capture-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    #btn-record {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2.5px solid var(--accent);
      background: rgba(108, 99, 255, 0.12);
      color: var(--text);
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    /* outer ring */
    #btn-record::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid rgba(108, 99, 255, 0.3);
      animation: ring-idle 2.2s ease-in-out infinite;
    }

    @keyframes ring-idle {
      0%, 100% { transform: scale(1);    opacity: 0.45; }
      50%       { transform: scale(1.06); opacity: 0.15; }
    }

    #btn-record:hover {
      background: rgba(108, 99, 255, 0.25);
      box-shadow: 0 0 24px rgba(108, 99, 255, 0.35);
    }

    #btn-record.recording {
      border-color: var(--red);
      background: rgba(255, 59, 92, 0.14);
      box-shadow: 0 0 28px rgba(255, 59, 92, 0.3);
    }

    #btn-record.recording::after {
      border-color: rgba(255, 59, 92, 0.6);
      animation: ring-record 0.9s ease-out infinite;
    }

    @keyframes ring-record {
      0%   { transform: scale(1);   opacity: 0.9; }
      100% { transform: scale(1.3); opacity: 0;   }
    }

    #btn-record:disabled {
      border-color: var(--border);
      background: transparent;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.5;
    }

    #btn-record:disabled::after { animation: none; opacity: 0; }

    .capture-label {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── State row ──────────────────────────────────────────────────── */
    .state-row {
      min-height: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      transition: color 0.3s;
    }

    .state-row.capturing     { color: var(--cyan); }
    .state-row.transcribing  { color: #fbbf24; }

    .dot-anim span {
      display: inline-block;
      animation: dot 1.2s infinite;
    }
    .dot-anim span:nth-child(2) { animation-delay: 0.18s; }
    .dot-anim span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes dot {
      0%, 80%, 100% { transform: translateY(0);    opacity: 0.35; }
      40%            { transform: translateY(-4px); opacity: 1;    }
    }

    /* ── Textarea ───────────────────────────────────────────────────── */
    #transcript {
      width: 100%;
      min-height: 240px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.75;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #transcript:focus { border-color: var(--accent); }

    /* ── Action buttons ─────────────────────────────────────────────── */
    .action-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn-action {
      padding: 0.45rem 0.9rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #12162a;
      color: #8898bb;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn-action:hover {
      background: #1c2240;
      border-color: var(--accent);
      color: var(--text);
    }

    #btn-clear { margin-left: auto; color: #f87171; border-color: #3b1515; background: #130c0c; }
    #btn-clear:hover { background: #1c0e0e; border-color: var(--red); }

    /* ── Toast ──────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green);
      color: #000;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand-name">🧠 Mega Cerebro</div>
    <div class="brand-sub">Neural Speech Engine</div>
  </div>
  <div class="header-right">
    <div class="force-badge">
      <div class="force-dot"></div>
      <span>Força Total</span>
    </div>
    <div id="status-badge">
      <div id="status-dot"></div>
      <span id="status-label">verificando...</span>
    </div>
  </div>
</header>

<div class="card">

  <!-- Sound wave visualizer -->
  <canvas id="waveform"></canvas>

  <!-- Central capture button -->
  <div class="capture-zone">
    <button id="btn-record">
      <span id="record-icon">⏺</span>
    </button>
    <div class="capture-label" id="capture-label">Capturar</div>
  </div>

  <!-- Live status text -->
  <div class="state-row" id="state-row">
    <span id="state-text">Pronto para capturar</span>
  </div>

  <!-- Transcript area -->
  <textarea id="transcript" placeholder="O texto transcrito aparecerá aqui e vai acumulando a cada gravação..."></textarea>

  <!-- Actions -->
  <div class="action-row">
    <button class="btn-action" id="btn-copy">📋 Copiar</button>
    <button class="btn-action" id="btn-save">💾 Salvar .txt</button>
    <button class="btn-action" id="btn-clear">🗑 Limpar</button>
  </div>

</div>

<div id="toast">Copiado!</div>

<script>
  const btnRecord    = document.getElementById('btn-record');
  const recordIcon   = document.getElementById('record-icon');
  const captureLabel = document.getElementById('capture-label');
  const stateRow     = document.getElementById('state-row');
  const stateText    = document.getElementById('state-text');
  const transcript   = document.getElementById('transcript');
  const btnCopy      = document.getElementById('btn-copy');
  const btnSave      = document.getElementById('btn-save');
  const btnClear     = document.getElementById('btn-clear');
  const statusDot    = document.getElementById('status-dot');
  const statusLabel  = document.getElementById('status-label');
  const toast        = document.getElementById('toast');
  const canvas       = document.getElementById('waveform');
  const ctx2d        = canvas.getContext('2d');

  let mediaRecorder = null;
  let chunks        = [];
  let stream        = null;
  let isRecording   = false;
  let animId        = null;
  let analyser      = null;
  let audioCtx      = null;
  let freqData      = null;

  // ── Canvas sizing ────────────────────────────────────────────────────────
  function resizeCanvas() {
    const dpr  = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const w    = rect.width - 56; // card padding × 2
    const h    = 72;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    ctx2d.scale(dpr, dpr);
  }

  window.addEventListener('resize', () => { resizeCanvas(); });
  window.addEventListener('load',   () => { resizeCanvas(); drawIdle(); });

  // ── Idle waveform (sine-based) ───────────────────────────────────────────
  function drawIdle() {
    const W  = canvas.clientWidth;
    const H  = canvas.clientHeight;
    const t  = Date.now() / 1000;
    const bars = 60;
    const barW = 3;
    const gap  = (W - bars * barW) / (bars + 1);
    const midH = H / 2;

    ctx2d.clearRect(0, 0, W, H);
    for (let i = 0; i < bars; i++) {
      const x    = gap + i * (barW + gap);
      const wave = (Math.sin(t * 1.4 + i * 0.38) * 0.5 + 0.5) * 0.25 + 0.04;
      const h    = wave * H;
      ctx2d.fillStyle = 'rgba(108, 99, 255, 0.3)';
      ctx2d.beginPath();
      ctx2d.roundRect(x, midH - h / 2, barW, h, 2);
      ctx2d.fill();
    }
    animId = requestAnimationFrame(drawIdle);
  }

  // ── Live waveform (real audio frequency) ────────────────────────────────
  function drawLive() {
    if (!analyser) return;
    analyser.getByteFrequencyData(freqData);

    const W    = canvas.clientWidth;
    const H    = canvas.clientHeight;
    const bars = freqData.length;
    const barW = (W / bars) * 0.55;
    const gap  = (W - bars * barW) / (bars + 1);

    ctx2d.clearRect(0, 0, W, H);

    for (let i = 0; i < bars; i++) {
      const val = freqData[i] / 255;
      const h   = Math.max(3, val * H);
      const x   = gap + i * (barW + gap);

      // gradient: blue-purple → cyan at top
      const grad = ctx2d.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, `rgba(0, 212, 255, ${0.7 + val * 0.3})`);
      grad.addColorStop(1, `rgba(108, 99, 255, ${0.5 + val * 0.3})`);
      ctx2d.fillStyle = grad;

      ctx2d.beginPath();
      ctx2d.roundRect(x, H - h, barW, h, 2);
      ctx2d.fill();
    }

    animId = requestAnimationFrame(drawLive);
  }

  function stopAnim() {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  // ── Status polling ───────────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      const ok = d.whisper_server === 'online';
      statusDot.className     = ok ? 'online' : 'offline';
      statusLabel.textContent = ok ? 'Servidor online' : 'Servidor offline';
    } catch {
      statusDot.className     = 'offline';
      statusLabel.textContent = 'Servidor offline';
    }
  }

  checkStatus();
  setInterval(checkStatus, 15000);

  // ── State helper ─────────────────────────────────────────────────────────
  function setState(mode, html) {
    stateRow.className  = 'state-row ' + mode;
    stateText.innerHTML = html;
  }

  // ── Record / Stop ─────────────────────────────────────────────────────────
  btnRecord.addEventListener('click', async () => {
    if (!isRecording) await startRecording();
    else              stopRecording();
  });

  async function startRecording() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert('Não foi possível acessar o microfone:\n' + e.message);
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    audioCtx.createMediaStreamSource(stream).connect(analyser);

    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = sendAudio;
    mediaRecorder.start();

    isRecording = true;
    btnRecord.classList.add('recording');
    recordIcon.textContent   = '⏹';
    captureLabel.textContent = 'Parar';
    setState('capturing', '● Captando áudio...');

    stopAnim();
    drawLive();
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    stream?.getTracks().forEach(t => t.stop());
    if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; }

    isRecording = false;
    btnRecord.classList.remove('recording');
    btnRecord.disabled       = true;
    recordIcon.textContent   = '⏺';
    captureLabel.textContent = 'Capturar';
    setState('transcribing',
      'Transcrevendo <span class="dot-anim"><span>.</span><span>.</span><span>.</span></span>');

    stopAnim();
    drawIdle();
  }

  async function sendAudio() {
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : 'audio/webm';
    const blob = new Blob(chunks, { type: mimeType });
    const ext  = mimeType.startsWith('audio/webm') ? 'webm' : 'ogg';
    const form = new FormData();
    form.append('file', blob, `recording.${ext}`);

    try {
      const resp = await fetch('/api/transcribe', { method: 'POST', body: form });
      const data = await resp.json();

      if (data.success) {
        const text = (data.result?.text || '').trim();
        if (text) {
          const cur = transcript.value.trim();
          transcript.value = cur ? cur + '\n\n' + text : text;
          transcript.scrollTop = transcript.scrollHeight;
        }
      } else {
        alert('Erro na transcrição:\n' + (data.error || 'Erro desconhecido'));
      }
    } catch (e) {
      alert('Falha ao enviar áudio:\n' + e.message);
    } finally {
      btnRecord.disabled = false;
      setState('', 'Pronto para capturar');
    }
  }

  // ── Action buttons ────────────────────────────────────────────────────────
  btnCopy.addEventListener('click', async () => {
    if (!transcript.value) return;
    await navigator.clipboard.writeText(transcript.value);
    showToast('Copiado!');
  });

  btnSave.addEventListener('click', () => {
    if (!transcript.value) return;
    const blob = new Blob([transcript.value], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `cerebro-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  btnClear.addEventListener('click', () => {
    if (transcript.value && confirm('Limpar todo o texto?')) transcript.value = '';
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
